# ---------------------------------------------------------------------------
# File:        seerr.subdomain.conf
# Install to:  <SWAG_CONFIG>/nginx/proxy-confs/seerr.subdomain.conf
#
# Purpose:     Serve Seerr (the maintained successor to Overseerr/Jellyseerr) at
#              https://seerr.example.com. Seerr has no URL base, so it uses a
#              dedicated subdomain rather than a subfolder. Covered by the
#              existing *.example.com wildcard certificate.
#
# Auth note:   Seerr has its own Plex-based login and is user-facing (request
#              portal), so it is NOT placed behind the Organizr forward-auth
#              gate; its own authentication is the access control. Requires a
#              Pi-hole local DNS A record: seerr.example.com -> 10.0.0.4
#
# ---------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name seerr.example.com;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        resolver 127.0.0.11 valid=30s;
        set $upstream_seerr http://seerr:5055;
        proxy_pass $upstream_seerr;
    }
}
