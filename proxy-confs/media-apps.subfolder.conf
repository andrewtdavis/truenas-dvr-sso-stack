# ---------------------------------------------------------------------------
# File:        media-apps.subfolder.conf
# Install to:  <SWAG_CONFIG>/nginx/proxy-confs/media-apps.subfolder.conf
#
# Purpose:     Organizr forward-auth gating + container-name upstreams for the
#              combined stack. Organizr stays outside the fold, reached at the
#              host alias.
#
# IPv4 pin:    Sabnzbd classifies "local" by source IP for its login bypass and
#              does not match the IPv6 ULA in its local_ranges, so its UI loops
#              on login when reached over v6. The Docker resolver below is set
#              ipv6=off and Sab's upstream uses a variable, forcing nginx to
#              resolve and connect over IPv4 so Sab sees a 172.16.x.x source and
#              treats it as local. This affects only SWAG -> Sab UI traffic;
#              Sab's own outbound (usenet over IPv6) is unaffected.
#
# ---------------------------------------------------------------------------

# Docker embedded DNS, IPv4-only, re-resolved at request time for variable upstreams.
resolver 127.0.0.11 ipv6=off valid=30s;

# Organizr stays outside the internal network; reach it at the host alias.
location ~ ^/auth-(\d+)$ {
    internal;
    proxy_pass http://10.0.0.4:31013/api/v2/auth?group=$1;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Original-URI $request_uri;
}
location @organizr_login { return 302 https://$host/; }

# --- *arr (group 3) --------------------------------------------------------

location /sonarr {
    auth_request /auth-3;
    error_page 401 = @organizr_login;
    include /config/nginx/proxy.conf;
    proxy_pass http://sonarr:30027;
}
location /sonarr/api { auth_request off; include /config/nginx/proxy.conf; proxy_pass http://sonarr:30027; }

location /radarr {
    auth_request /auth-3;
    error_page 401 = @organizr_login;
    include /config/nginx/proxy.conf;
    proxy_pass http://radarr:30025;
}
location /radarr/api { auth_request off; include /config/nginx/proxy.conf; proxy_pass http://radarr:30025; }

location /lidarr {
    auth_request /auth-3;
    error_page 401 = @organizr_login;
    include /config/nginx/proxy.conf;
    proxy_pass http://lidarr:30014;
}
location /lidarr/api { auth_request off; include /config/nginx/proxy.conf; proxy_pass http://lidarr:30014; }

# --- Admin only (group 0) --------------------------------------------------

location /prowlarr {
    auth_request /auth-0;
    error_page 401 = @organizr_login;
    include /config/nginx/proxy.conf;
    proxy_pass http://prowlarr:30050;
}
location /prowlarr/api { auth_request off; include /config/nginx/proxy.conf; proxy_pass http://prowlarr:30050; }

location /cleanuparr {
    auth_request /auth-0;
    error_page 401 = @organizr_login;
    include /config/nginx/proxy.conf;
    proxy_pass http://cleanuparr:11011;
}

# --- Power user (group 3) --------------------------------------------------

location /bazarr {
    auth_request /auth-3;
    error_page 401 = @organizr_login;
    include /config/nginx/proxy.conf;
    proxy_pass http://bazarr:6767;
}
location /bazarr/api { auth_request off; include /config/nginx/proxy.conf; proxy_pass http://bazarr:6767; }

# Sabnzbd: IPv4-pinned upstream (see header). Variable proxy_pass forces the
# resolver, ipv6=off yields the A record, so Sab sees a v4 local source.
location /sabnzbd {
    auth_request /auth-3;
    error_page 401 = @organizr_login;
    include /config/nginx/proxy.conf;
    set $sab_upstream http://sabnzbd:30055;
    proxy_pass $sab_upstream;
}
location /sabnzbd/api {
    auth_request off;
    include /config/nginx/proxy.conf;
    set $sab_api_upstream http://sabnzbd:30055;
    proxy_pass $sab_api_upstream;
}

# --- Co-admin and up (group 1) ---------------------------------------------

location /tautulli {
    auth_request /auth-1;
    error_page 401 = @organizr_login;
    include /config/nginx/proxy.conf;
    proxy_pass http://tautulli:8181;
}
location /tautulli/api { auth_request off; include /config/nginx/proxy.conf; proxy_pass http://tautulli:8181; }
